<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EazyCar - Relatório de Receitas</title>
    <link rel="stylesheet" href="../CSS/ui.css">
    <script src="../JS/config.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
    <script defer src="../JS/relatorio.js"></script>
    <style>
        /* Cores de status usadas só no relatório */
        .tag-rel-em-uso     { background: #dbeafe; color: #1e40af; }
        .tag-rel-cancelada  { background: #fee2e2; color: #991b1b; }
        .tag-rel-aguardando { background: #fef3c7; color: #92400e; }
        .tag-rel-ativa      { background: #e5e7eb; color: #374151; }
        #btn_exportar_csv { white-space: nowrap; }
        .vehicles-table .tag { white-space: nowrap; }
        #btn_exportar_csv:disabled { opacity: .5; cursor: not-allowed; }
    </style>
</head>

<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-mark" aria-label="EazyCar">
                    <span class="brand-eazy">Eazy</span><span class="brand-car">Car</span>
                </div>
            </div>

            <nav>
                <ul class="menu">
                    <li><a href="dashboard.html">Painel</a></li>
                    <li><a href="listar_veiculos.html">Veículos</a></li>
                    <li><a href="cadastro_veiculo.html">Novo Veículo</a></li>
                    <li><a href="relatorio.html" class="active">Relatório</a></li>
                </ul>
            </nav>

            <a class="logout" href="#" id="btn_logout">Sair</a>
        </aside>

        <main class="main">
            <header class="topbar">EazyCar • Gestão de Aluguel de Carros</header>

            <section class="content">
                <h1>Relatório de Receitas</h1>
                <p>Filtre por período, veículo, categoria, status, tipo e local para visualizar as receitas geradas</p>

                <form class="card" id="form_relatorio" style="display:flex;flex-direction:column;gap:1rem">
                    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(max(170px,calc((100% - 2rem) / 3)),1fr));gap:1rem">
                        <div class="field" style="min-width:0">
                            <label for="data_inicio">Data inicial</label>
                            <input type="date" id="data_inicio" required>
                        </div>
                        <div class="field" style="min-width:0">
                            <label for="data_fim">Data final</label>
                            <input type="date" id="data_fim" required>
                        </div>
                        <div class="field" style="min-width:0">
                            <label for="filtro_categoria">Categoria</label>
                            <select id="filtro_categoria">
                                <option value="">Todas</option>
                            </select>
                        </div>
                    </div>
                    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(max(170px,calc((100% - 3rem) / 4)),1fr));gap:1rem">
                        <div class="field" style="min-width:0">
                            <label for="filtro_veiculo">Veículo</label>
                            <select id="filtro_veiculo">
                                <option value="">Todos</option>
                            </select>
                        </div>
                        <div class="field" style="min-width:0">
                            <label for="filtro_status">Status da reserva</label>
                            <select id="filtro_status">
                                <option value="">Todos</option>
                            </select>
                        </div>
                        <div class="field" style="min-width:0">
                            <label for="filtro_tipo">Tipo de reserva</label>
                            <select id="filtro_tipo">
                                <option value="">Todos</option>
                            </select>
                        </div>
                        <div class="field" style="min-width:0">
                            <label for="filtro_local">Local de retirada</label>
                            <select id="filtro_local">
                                <option value="">Todos</option>
                            </select>
                        </div>
                    </div>
                    <div style="display:flex;gap:.75rem;width:100%">
                        <button class="btn" type="submit" style="margin-bottom:0">Gerar Relatório</button>
                        <button class="btn" type="button" id="btn_limpar_filtros" style="margin-bottom:0;background:#fff;color:var(--text);border:1px solid var(--line)">Limpar filtros</button>
                    </div>
                </form>

                <div id="resultado" style="margin-top:1.5rem"></div>
            </section>
        </main>
    </div>

</body>

</html>
